.logo{display:inline-block;background:#fff;border-radius:10px;padding:6px 10px;margin-bottom:12px}.logo img{display:block;height:48px;width:auto}

<h1>Attendance Notice</h1>
<p class="sub">Tell your managers if you'll be late, absent, or leaving early.</p>
<div class="card">
  <label for="name">Your name</label><input id="name" autocomplete="name">
  <label for="team">Team</label><select id="team"><option value="">Select team</option><option>Client Success</option><option>KYC</option></select>
  <label for="shift">Shift start time</label><select id="shift"></select>
  <label for="type">What's happening?</label>
  <select id="type"><option>Running Late</option><option>Absent</option><option>Leaving Early</option><option>Other</option></select>
  <label for="date">Date</label><input id="date" type="date">
  <label for="time">Expected arrival / departure time (optional)</label><input id="time" type="time">
  <label for="why">Reason / notes</label><textarea id="why"></textarea>
  <button id="send" type="button">Send to managers</button>
  <p id="msg"></p>
</div>
</main>
<script>
// PASTE your Power Automate "HTTP POST URL" between the quotes:
const WEBHOOK_URL = "https://default1761aae7aad0481294e8af2c95c047.61.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/22/workflows/58d51e0b84af4aad961ebc9243bbed35/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=xlZ6F4oT35uhqUdRj9O6cFaF2zd6D1WJo1ZKd3xNoNY";

const $ = id => document.getElementById(id);
(() => {
  const o = ['<option value="">Select start time</option>'];
  for (let m = 0; m < 1440; m += 30) {
    const h = Math.floor(m / 60), n = m % 60;
    o.push("<option>" + (h % 12 || 12) + ":" + String(n).padStart(2, "0") + (h < 12 ? " AM" : " PM") + "</option>");
  }
  $("shift").innerHTML = o.join("");
  $("date").value = new Date().toISOString().slice(0, 10);
})();
const say = (t, c) => { $("msg").textContent = t; $("msg").className = c || ""; };
$("send").onclick = async () => {
  const p = {
    name: $("name").value.trim(), team: $("team").value.trim(), shift: $("shift").value,
    type: $("type").value, date: $("date").value, time: $("time").value, reason: $("why").value.trim(),
    submittedAt: new Date().toISOString()
  };
  if (!p.name || !p.team || !p.date || !p.shift) return say("Please enter your name, team, date and shift start time.", "er");
  if (!WEBHOOK_URL) return say("This form isn't connected yet. Ask your admin to add the webhook URL.", "er");
  p.message = "An attendance notification for " + p.name + " has been submitted.";
  $("send").disabled = true;
  try {
    await fetch(WEBHOOK_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(p) });
    say("Sent. Your managers have been notified.", "ok");
    $("why").value = ""; $("time").value = "";
  } catch (e) {
    say("Couldn't send. Check your connection and try again.", "er");
  }
  setTimeout(() => { $("send").disabled = false; }, 8000);
};
</script></body></html>
